name: CI

on:
  push:
    branches: [main]
  pull_request:

# Third-party actions are pinned to a full commit SHA (the tag is in the comment):
# a moved or hijacked tag cannot change what runs. Update them deliberately.
# Least privilege: jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: fmt / check / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The channel is pinned in `rust-toolchain.toml` (1.97.1); rustup honours it,
      # this step only makes sure the toolchain and components are installed.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets --locked

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      # Audit finding #48: the gRPC link (`src/network/grpc.rs`) is compiled only with
      # `--features grpc`, and only once its dependencies are declared in Cargo.toml
      # (docs/yellowstone-adapter.md). Until then these steps say so and pass; after
      # that they are the same three gates with the feature on. A half-done enabling
      # is caught by tests/manifest_tests.rs.
      - name: Check, clippy and tests with the gRPC link
        shell: bash
        run: |
          if grep -Eq '^yellowstone-grpc-proto[[:space:]]*=[[:space:]]*\{[[:space:]]*workspace' Cargo.toml \
             && grep -Eq '^grpc[[:space:]]*=[[:space:]]*\["dep:' Cargo.toml; then
            cargo check --all-targets --locked --features grpc
            cargo clippy --all-targets --locked --features grpc -- -D warnings
            cargo test --locked --features grpc
          else
            echo "gRPC dependencies are not declared yet: skipping the --features grpc gates"
          fi

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit

      # Fails the job on any known advisory in Cargo.lock. To accept a reviewed,
      # unavoidable transitive advisory, list its id in `.cargo/audit.toml`
      # (`[advisories] ignore = ["RUSTSEC-..."]`) together with the reason.
      - name: Audit dependencies
        run: cargo audit

  gitleaks:
    name: gitleaks
    # gitleaks-action needs a `GITLEAKS_LICENSE` secret only for repositories owned by an
    # organization; this repository belongs to a personal account. If it moves to an
    # organization, add the secret or replace this job with the gitleaks CLI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: secrets removed from the tree can still live in old commits.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
