[workspace]
resolver = "2"
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

# Single source of truth for dependency versions. Future crates split out of
# `src/` (storage, builder, network, monitor) inherit them with
# `dep = { workspace = true }`.
#
# Solana crates are pinned to a mutually compatible generation:
#   solana-client 4.3 -> solana-keypair ^3.1, solana-pubkey ^4.3, solana-commitment-config ^3.1
#   solana-sdk    4.1 -> solana-keypair ^3.0, solana-pubkey ^4.3
# (solana-sdk 5.x / solana-keypair 4.x are NOT compatible with solana-client 4.3.)
[workspace.dependencies]
# Async runtime (used from Phase 2 onwards).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs"] }

# Solana.
solana-sdk = "4.1"
solana-client = "4.3"
solana-keypair = "3.1"
# `curve25519` enables PDA derivation (`Pubkey::try_find_program_address`) off-chain. The
# optional crates it needs (`curve25519-dalek`, ...) are already in Cargo.lock.
solana-pubkey = { version = "4.3", features = ["curve25519"] }
solana-commitment-config = "3.1"

# Memory safety and errors.
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2"

# Serialization and environment.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
bs58 = "0.5"
# Shared, reference-counted byte buffers (already in Cargo.lock through reqwest).
bytes = "1"

# HTTP (rustls only: no OpenSSL / system TLS dependency, friendly to Windows builds).
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

# gRPC link (feature `grpc`, audit finding #48): PLACEHOLDERS, not used by any package yet.
# Cargo only resolves workspace dependencies that a package actually uses, so declaring them
# here leaves `Cargo.lock` and the offline `--locked` gates untouched (checked with cargo
# 1.97: no lock entry, no warning). `"*"` is a stand-in: when enabling the link, replace each
# with the exact release that shares one `tonic` and matches the Solana generation above
# (`cargo add` / `cargo info` on a machine that reaches crates.io), and give `tonic` its
# TLS-roots feature (its name depends on the version: `tls-native-roots`, `tls-roots`, ...).
# `tests/manifest_tests.rs` keeps the manifest and the lockfile consistent either way.
yellowstone-grpc-proto = { version = "*", default-features = false }
tonic = { version = "*", default-features = false }
tokio-stream = { version = "*", default-features = false }

# Observability.
tracing = "0.1"
tracing-appender = "0.2"
# `env-filter` gives `EnvFilter` (RUST_LOG). Default features are off: no ANSI colours,
# no `log` bridge. NOTE: `env-filter` pulls in `matchers`, which is not yet in
# `Cargo.lock`: regenerate the lockfile once (`cargo update -w`) and commit it.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }

[package]
name = "krypton"
description = "Krypton - Solana Atomic Launcher & Liquidity Engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# Minimum supported Rust version; keep in sync with rust-toolchain.toml.
rust-version = "1.97.1"

[features]
# The `tonic` Yellowstone link (`src/network/grpc.rs`). While it is `[]` it pulls no
# dependency: the default build, and Cargo.lock, do not change.
#
# TO ENABLE (a machine that reaches crates.io; docs/yellowstone-adapter.md has the whole
# procedure), do these three edits together, then `cargo update -w` and commit the lock:
#   1. replace the line below with:
#        grpc = ["dep:yellowstone-grpc-proto", "dep:tonic", "dep:tokio-stream"]
#   2. pin the three placeholders in `[workspace.dependencies]` above;
#   3. uncomment the three optional dependencies in `[dependencies]` below.
# Default builds still compile without them: `optional = true` keeps them out of the code
# unless `--features grpc` is given (they only appear in Cargo.lock, which is committed).
grpc = []

[dependencies]
# gRPC link, optional (see `[features]` for the three edits that enable it):
# yellowstone-grpc-proto = { workspace = true, optional = true }
# tonic = { workspace = true, optional = true }
# tokio-stream = { workspace = true, optional = true }
tokio = { workspace = true }
solana-sdk = { workspace = true }
solana-client = { workspace = true }
solana-keypair = { workspace = true }
solana-pubkey = { workspace = true }
solana-commitment-config = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = { workspace = true }
bs58 = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# `#[tokio::test(start_paused = true)]` needs `test-util`. Feature unification only
# adds the feature flag to the existing tokio package: no new entries in Cargo.lock.
tokio = { workspace = true, features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# `panic = "abort"` is intentionally NOT set: with unwinding, destructors still run
# during a panic, so `ZeroizeOnDrop` secrets are wiped on that path as well.
